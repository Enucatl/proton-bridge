name: Headless container CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Read upstream version
        id: version
        run: echo "upstream_version=$(sed -n 's/^BRIDGE_APP_VERSION?=\([0-9.]*\)+git$/\1/p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Format, vet, unit/integration tests, race and reachable Go vulnerabilities
        run: ./scripts/headless/run.sh check
      - name: Smoke-test Debian nonroot runtime
        run: ./scripts/headless/smoke.sh

  image:
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: Enucatl/docker-compose-security-baseline/.github/workflows/docker-ci.yml@main
    with:
      image_name: ghcr.io/enucatl/proton-bridge
      version: v${{ needs.check.outputs.upstream_version }}
      meta_tags: |
        type=raw,value=v${{ needs.check.outputs.upstream_version }}
      dockerfile: scripts/headless/Dockerfile.image
      trivy_skip_dirs: .git,headless-dist
      build_args: REVISION=${{ github.sha }}
      cache: false
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Enucatl/proton-bridge' }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

name: Latest headless dependencies

on:
  schedule:
    - cron: '22 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Resolve latest stable Go and fresh runtime image
        shell: bash
        run: |
          docker pull --platform linux/amd64 golang:1-trixie
          docker pull --platform linux/amd64 gcr.io/distroless/base-nossl-debian13:nonroot
          go_version=$(docker run --rm --platform linux/amd64 golang:1-trixie go env GOVERSION)
          builder_digest=$(docker image inspect golang:1-trixie --format '{{index .RepoDigests 0}}')
          runtime=$(docker image inspect gcr.io/distroless/base-nossl-debian13:nonroot --format '{{index .RepoDigests 0}}')
          builder="golang:${go_version#go}-trixie@${builder_digest##*@}"
          sed -i \
            -e "s|^FROM golang:.* AS builder$|FROM $builder AS builder|" \
            -e "s|^FROM gcr.io/distroless/base-nossl-debian13:.* AS debian$|FROM gcr.io/distroless/base-nossl-debian13:nonroot@${runtime##*@} AS debian|" \
            scripts/headless/Dockerfile.image
      - name: Check dependency upgrade behavior
        run: ./scripts/headless/latest-deps_test.sh
      - name: Upgrade headless dependencies and Proton replacements
        run: ./scripts/headless/run.sh latest-deps
      - name: Format, vet, unit/integration tests, race and reachable Go vulnerabilities
        run: ./scripts/headless/run.sh check
      - name: Build candidate runtime image
        run: |
          docker build --platform linux/amd64 --target runtime \
            --build-arg "REVISION=${{ github.sha }}" \
            -f scripts/headless/Dockerfile.image -t proton-bridge-headless:compatibility .
      - name: Smoke-test candidate runtime
        run: ./scripts/headless/smoke.sh
      - name: Save candidate updates, including failed attempts
        if: always()
        run: |
          mkdir -p headless-dist/compatibility
          git diff -- go.mod go.sum scripts/headless/Dockerfile.image > headless-dist/compatibility/updates.patch
          cp go.mod go.sum scripts/headless/Dockerfile.image headless-dist/compatibility/
      - name: Upload candidate updates
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latest-deps-${{ github.run_id }}-${{ github.run_attempt }}
          path: headless-dist/compatibility/
          if-no-files-found: error
          retention-days: 14
